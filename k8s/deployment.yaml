---
apiVersion: v1
kind: Namespace
metadata:
  name: schemahub

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemahub
  namespace: schemahub
  labels:
    app: schemahub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schemahub
  template:
    metadata:
      labels:
        app: schemahub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schemahub
          image: your-registry/schemahub:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      # Uncomment and configure if your registry requires authentication
      # imagePullSecrets:
      #   - name: registry-pull-secret

---
apiVersion: v1
kind: Service
metadata:
  name: schemahub
  namespace: schemahub
  labels:
    app: schemahub
spec:
  selector:
    app: schemahub
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
