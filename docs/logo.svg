<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SchemaHub</title>
  <desc>SchemaHub logo — SH monogram in Barlow Condensed Light on blue</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&display=swap');</style>
    <clipPath id="rc">
      <rect x="0" y="0" width="400" height="400" rx="80"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="80" fill="#2563eb"/>

  <!-- Arc accents -->
  <circle cx="370" cy="35" r="140" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" clip-path="url(#rc)"/>
  <circle cx="370" cy="35" r="90"  fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" clip-path="url(#rc)"/>
  <circle cx="45"  cy="405" r="150" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.10" clip-path="url(#rc)"/>

  <!-- Node motif -->
  <circle cx="130" cy="58" r="6" fill="#ffffff" opacity="0.55"/>
  <circle cx="155" cy="58" r="6" fill="#ffffff" opacity="0.35"/>
  <circle cx="180" cy="58" r="6" fill="#ffffff" opacity="0.20"/>
  <line x1="136" y1="58" x2="149" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <line x1="161" y1="58" x2="174" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.20"/>

  <!-- SH monogram -->
  <text x="200" y="275"
        font-family="'Barlow Condensed', sans-serif"
        font-size="210" font-weight="300"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="6">SH</text>

  <!-- Wordmark -->
  <text x="200" y="338"
        font-family="'Barlow Condensed', sans-serif"
        font-size="22" font-weight="300"
        fill="#ffffff" opacity="0.65"
        text-anchor="middle"
        letter-spacing="10">SCHEMAHUB</text>

  <!-- Bottom accent dots -->
  <circle cx="318" cy="352" r="4" fill="#ffffff" opacity="0.30"/>
  <circle cx="334" cy="352" r="4" fill="#ffffff" opacity="0.18"/>

</svg>
